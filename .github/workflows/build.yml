name: Docker

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [ubuntu, warp] # a directory each; warp is the box's WARP sidecar
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: "v2.2.4"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=sha

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: ${{ matrix.image }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  # Prod only: cloudflared (and so the box's hostname) only runs in prod.
  helm:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [ubuntu, warp] # a directory each; warp is the box's WARP sidecar
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout homelab
        uses: actions/checkout@v4
        with:
          repository: nopsqi/homelab
          token: ${{ secrets.HOMELAB_TOKEN }}
          path: homelab
      - name: Set SHORT_SHA
        run: echo "SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)" >> $GITHUB_ENV
      - name: Update prod tag
      - name: Update image tags (staging live now, prod after promotion)
        run: |
          sed -i "s/tag:.*/tag: sha-${{ env.SHORT_SHA }}/" homelab/helm/linux-box/values.${{ matrix.image }}.prod.yaml
      - name: Commit and push to master
        working-directory: homelab
        run: |
          git config user.name "github-action"
          git config user.email "github-action@github.com"
          git add helm/linux-box/values.${{ matrix.image }}.prod.yaml
          git diff --cached --quiet || git commit -m "ci: linux-box-${{ matrix.image }} image sha-${{ env.SHORT_SHA }}"
          git pull --rebase origin master
          git push
      - name: Open promotion PR (master -> prod) if none is open
        working-directory: homelab
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_TOKEN }}
        run: |
          gh pr create --base prod --head master --title "promote: master -> prod" \
            --body "Promote everything verified on staging (master) to production (prod branch)." \
            || echo "promotion PR already open"
